disabled_rules:
  - todo
included:
  - Sources

excluded:
  - Sources/**/Autogenerated

# The POSIX/C-interop shims (IO/POSIX.swift, IO/FileIO.swift) and the config
# parser lean on short C-style names — fd, rc, p, v — where spelling them out
# would obscure rather than clarify. Underscores for the same reason:
# system_errno mirrors the C symbol it wraps.
identifier_name:
  min_length: 1
  allowed_symbols: ["_"]
