name: Swift CI

# The unit tests, on both platforms, on the dynamic build. The Static SDK
# ships no test framework, so this is the only unit-test coverage there is.
#
# Both jobs run the flake's checks: the Swift toolchain and every C library
# come from flake.lock, the same ones a developer gets from `nix develop`.

on:
  push:
    branches:
      - master
      - main
      - "modernize-*"
  # No branch filter: a pull request should be tested wherever it is headed.
  # Filtering on master/main means a stacked PR -- one based on another
  # open PR's branch -- matches nothing and silently gets no CI at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      - name: swift test
        run: nix build ".#checks.${{ matrix.system }}.unit" --print-build-logs

      # The dev loop, not just the derivation: a devShell that cannot build
      # is a regression even when the package can.
      - name: swift build in nix develop
        run: nix develop --command swift build --build-system native

      - name: swiftlint
        if: matrix.system == 'x86_64-linux'
        run: nix build .#checks.x86_64-linux.lint --print-build-logs
