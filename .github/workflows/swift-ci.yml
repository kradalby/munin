name: Swift CI

# The unit tests live here, on both platforms.

on:
  push:
    branches:
      - master
      - main
      - "modernize-*"
  # No branch filter: a pull request should be tested wherever it is headed.
  # Filtering on master/main means a stacked PR -- one based on another
  # open PR's branch -- matches nothing and silently gets no CI at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    # Every run step happens inside the devShell, so CI links the same
    # libvips and libexif developers do. Consequence: nothing may `run:`
    # before the nix installer, which is why the setup steps below are all
    # `uses:`.
    #
    # Deliberately per-job rather than workflow-wide: the devShell's
    # PKG_CONFIG_PATH is glibc-flavoured, and SwiftPM reads host .pc
    # directories even when cross-compiling, so nothing that targets musl
    # may inherit this.
    defaults:
      run:
        shell: nix develop --fallback --command bash -e {0}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0

      # swiftlint parses sources rather than compiling them, so this job needs
      # no Swift toolchain and no build.
      - name: swiftlint
        run: swiftlint lint

  # Linux is a separate job from macOS because the two need different C
  # libraries, and only one of them can use nix.
  #
  # nix is deliberately absent here. The devShell has no cc-wrapper, so it
  # bakes no -rpath, so a binary linked in it cannot find libvips.so.42 at run
  # time -- `swift build` passes and `swift test` dies on exec. LD_LIBRARY_PATH
  # does not rescue it: that applies to every process in the shell, so the
  # Swift.org toolchain loads nix's libcurl/libxml2 against the system glibc
  # and `swift --version` segfaults. Distro packages sit on the default loader
  # path and need none of this -- and they are what README.md tells a Linux
  # user to install, so this job now exercises the documented setup.
  test-linux:
    runs-on: ubuntu-24.04
    # The official Swift image, rather than downloading a tarball onto the
    # runner: it is the same 6.3.1 toolchain, already unpacked and cached by
    # the registry.
    container: swift:6.3.1

    # A `container:` job defaults to `sh -e`, which is dash in this image and
    # has no `pipefail`. The image ships bash; ask for it explicitly.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install C dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            libvips-dev libexif-dev libiptcdata0-dev pkg-config

      - name: Verify Swift toolchain
        run: swift --version

      - name: Cache Swift build artefacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .build
          key: swift-build-linux-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-build-linux-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

  # The C libraries come from nix here, which works because nix dylibs carry
  # absolute install names -- dyld needs no search path, so the run-time
  # problem that rules nix out on Linux does not arise.
  test-macos:
    runs-on: macos-latest

    defaults:
      run:
        shell: nix develop --fallback --command bash -e {0}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0

      # --- Swift toolchain -------------------------------------------------

      # Deliberately not from the flake — see the flake.nix header for why.
      # It lands on the ambient PATH, which `nix develop` preserves.

      - name: Cache Swift toolchain
        id: cache-swift-macos
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /Library/Developer/Toolchains/swift-6.3.1-RELEASE.xctoolchain
          key: swift-6.3.1-macos-latest

      - name: Install Swift 6.3.1
        if: steps.cache-swift-macos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO https://download.swift.org/swift-6.3.1-release/xcode/swift-6.3.1-RELEASE/swift-6.3.1-RELEASE-osx.pkg
          sudo installer -pkg swift-6.3.1-RELEASE-osx.pkg -target /

      - name: Put Swift on PATH
        run: echo "/Library/Developer/Toolchains/swift-6.3.1-RELEASE.xctoolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Verify Swift toolchain
        run: swift --version

      # --- Build + test ----------------------------------------------------

      - name: Cache Swift build artefacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .build
          key: swift-build-macos-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-build-macos-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test
