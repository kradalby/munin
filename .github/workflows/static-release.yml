name: Static Linux

# Builds the Linux binaries -- one file each, needing no dynamic loader and no
# shared libraries -- for amd64 and arm64, and publishes them to Releases.
#
# No CI-only build path here: `nix build .#munin-static-amd64` is what a
# developer runs, what `make static` runs, and what garnix builds. The runner
# only puts the artefacts somewhere.
#
# The correctness assertions live in garnix's checks.x86_64-linux.smoke-*.
# This re-runs one so a tag does not depend on another system being green at
# the moment it is pushed.
#
# Separate from swift-ci.yml because that runs inside `nix develop`, whose
# PKG_CONFIG_PATH is glibc-flavoured -- and SwiftPM's .pc parser reads host
# directories even during a --swift-sdk build.
#
# No unit tests: the Static SDK ships no test framework, so `swift test
# --swift-sdk <musl triple>` is impossible. They stay in swift-ci.yml.

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  # No branch filter: a pull request should be tested wherever it is headed.
  # Filtering on master/main means a stacked PR -- one based on another
  # open PR's branch -- matches nothing and silently gets no CI at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancellable: a tag push publishes a release and must
  # never be interrupted part way through uploading its assets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    # A cold run builds the musl C closure from source plus the toolchain;
    # hestia makes later runs a download. A ceiling for hung jobs, not a
    # budget.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            asset: munin-linux-amd64
          - arch: arm64
            asset: munin-linux-arm64
    env:
      ARCH: ${{ matrix.arch }}
      # Release only. Non-tag runs used to attach a debug build, but the
      # Static SDK compiles in SWIFT_BACKTRACE=enable=no and ships no
      # backtrace helper, so a crash is a bare SIGILL either way.
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      # upstream-cache-filter keeps cache.nixos.org paths out of the per-repo
      # cache budget, which swift-ci.yml's caches also draw on.
      - uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          upstream-cache-filter: "true"

      # A cold run does not fit alongside the preinstalled toolchains.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      # The derivation already asserts the binary needs no loader and no
      # shared libraries, has the right machine type, and retains no store
      # references.
      - name: Build munin-static-${{ matrix.arch }}
        run: |
          set -euo pipefail
          nix build ".#munin-static-$ARCH" --print-build-logs
          file result/bin/munin
          nix path-info -Sh ./result

      # --no-link matters: otherwise this repoints ./result at the check's own
      # output, an empty file, and the next step has no binary to stage.
      - name: Smoke test
        run: nix build ".#checks.x86_64-linux.smoke-$ARCH" --no-link --print-build-logs

      - name: Stage artefact
        run: install -Dm755 result/bin/munin "$RUNNER_TEMP/out/$ASSET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/out/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # `v*` tags only. Other runs attach artefacts to the run page instead; a
  # rolling `latest` release would duplicate that and delete-and-recreate on
  # every commit.
  # ---------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: munin-linux-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      # Both names spelled out: `sha256sum munin-linux-*` would happily
      # produce a one-line SHA256SUMS if an arch went missing.
      - name: Checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          test -s munin-linux-amd64
          test -s munin-linux-arm64
          sha256sum munin-linux-amd64 munin-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      # Bare binaries rather than tarballs: one static executable is
      # friendliest as `curl -L -o munin .../munin-linux-amd64 && chmod +x`.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          assets=(munin-linux-amd64 munin-linux-arm64 SHA256SUMS)

          # Idempotent by construction, so re-running a failed release job is
          # safe: a release that already exists gets its assets replaced
          # rather than a hard failure on "already exists". `gh release
          # create` uploads assets after creating the release, so a create
          # that died half way leaves a release at the right commit and this
          # replays only the upload.
          publish() {
            local tag="$1"; shift
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              gh release create "$tag" "$@" "${assets[@]}"
            fi
          }

          publish "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
