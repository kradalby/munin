# Golden/fixture/asset data is excluded from the whitespace/EOF fixers, and so
# is vendor/ — rewriting vendored files would make them diverge from upstream
# for no reason (see vendor/swift-vips/VENDORED.md).
exclude: '^(example/|Tests/.*/Fixtures/|assets/|vendor/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: mixed-line-ending

# Swift formatting + linting run via `make fmt` / `make lint` (swift-format +
# swiftlint from the devShell) and in CI — not duplicated as prek hooks.
